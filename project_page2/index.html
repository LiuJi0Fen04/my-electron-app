<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; img-src 'self' data:;">
    <title>Electron Four-Part Layout</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="left-panel">
            <h2>Tool</h2>
            <!-- Tools will be dynamically loaded here by renderer.js -->
        </div>

        <div class="horizontal-resizer" id="left-middle-resizer"></div>

        <div class="middle-panel">
            <h2>Procedure Editor</h2>
            <div class="middle-content-wrapper">
                <div class="procedure-canvas-container">
                    <canvas id="procedureCanvas"></canvas>
                    <div class="overview-window-wrapper">
                        <button id="toggle-overview-btn" class="overview-toggle-btn" title="Toggle Overview (O)">
                            &#9650;
                        </button>
                        <div class="overview-window hidden">
                            <!-- <h3>Overview</h3> -->
                            <canvas id="overviewCanvas"></canvas>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="horizontal-resizer" id="middle-right-resizer"></div>

        <div class="right-panels-container">
            <div class="right-top-panel">
                <div class="canvas-header">
                    <button id="open-folder-btn">Open Image Folder</button>
                </div>
                <div class="canvas-container">
                    <canvas id="imageCanvas"></canvas>
                    <div class="thumbnail-gallery" id="thumbnailGallery">
                        <!-- <div id="spacer"></div> 
                        <div id="thumbnailsContainer"></div> -->
                    </div>                       
                </div>
            </div>
            <div class="vertical-resizer" id="right-top-bottom-resizer"></div>
            <div class="right-bottom-panel">
                <h2>AI Assistant</h2>
                <div class="ai-assistant-content">
                    <p>Ask about the <strong>selected node</strong>:</p>
                    <textarea id="ai-prompt-input" placeholder="e.g., Suggest next steps for this node, Explain its function..."></textarea>
                    <button id="generate-insight-btn">Generate Insight</button>
                    <div id="ai-loading-indicator" class="loading-spinner hidden"></div>
                    <div id="ai-response-output"></div>
                </div>
            </div>
        </div>
    </div>

    <div id="node-context-menu" class="context-menu hidden">
        <div class="context-menu-item" id="context-delete-node">Delete Node <span>(Del)</span></div>
        <div class="context-menu-item" id="context-copy-node">Copy Node <span>(Ctrl+C)</span></div>
    </div>

    <!-- New: Context Menu for Canvas Background -->
    <div id="canvas-context-menu" class="context-menu hidden">
        <div class="context-menu-item" id="context-pan-mode">Pan Mode <span>(P)</span></div>
        <div class="context-menu-item" id="context-select-mode">Select Mode <span>(S)</span></div>
        <div class="context-menu-item" id="context-clear-selection">Clear Node Selection</div>
        <div class="context-menu-item" id="context-delete-all-connections">Delete All Connections</div>
        <div class="context-menu-item" id="context-delete-selected-connection">Delete Selected Connection <span>(Del)</span></div>
    </div>

    <script src="renderer.js"></script>
</body>
</html>
