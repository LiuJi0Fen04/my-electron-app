<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; img-src 'self' data:;">
    <title>Electron Four-Part Layout</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="left-panel">
            <h2>Tool</h2>
            <!-- image capture -->
            <div class="tool" id="image-caputre">
                <h3>Capture</h3>
                <!-- Container for sub-tools, now hidden and used as a template -->
                <div class="sub-tools-container" id="imagecapture-subtools">
                    <!-- Each sub-tool is draggable -->
                    <div class="sub-tool" draggable="true" data-tool="camera">Camera</div>
                    <div class="sub-tool" draggable="true" data-tool="folder">Folder</div>
                </div>
            </div>
            <!-- Pre-process Tool Section -->
            <div class="tool" id="preprocess-tool">
                <h3>Preprocs</h3>
                <!-- Container for sub-tools, now hidden and used as a template -->
                <div class="sub-tools-container" id="preprocess-subtools">
                    <!-- Each sub-tool is draggable -->
                    <div class="sub-tool" draggable="true" data-tool="sharpness">Sharpness</div>
                    <div class="sub-tool" draggable="true" data-tool="blur">Blur</div>
                    <div class="sub-tool" draggable="true" data-tool="threshold">Threshold</div>
                </div>
            </div>
            
            <!-- Detection Tool Section -->
            <div class="tool" id="detection-tool">
                <h3>Detection</h3>
                <!-- Container for sub-tools, now hidden and used as a template -->
                <div class="sub-tools-container" id="detection-subtools">
                    <!-- Each sub-tool is draggable -->
                    <div class="sub-tool" draggable="true" data-tool="line-detection">Line Detection</div>
                    <div class="sub-tool" draggable="true" data-tool="circle-detection">Circle Detection</div>
                </div>
            </div>
            <!-- logic Tool Section -->
            <div class="tool" id="detection-tool">
                <h3>logic</h3>
                <div class="sub-tools-container" id="detection-subtools">
                    <!-- Each sub-tool is draggable -->
                    <div class="sub-tool" draggable="true" data-tool="if">If</div>
                    <div class="sub-tool" draggable="true" data-tool="for">For</div>
                    <div class="sub-tool" draggable="true" data-tool="while">While</div>
                </div>
            </div>
        </div>

        <div class="horizontal-resizer" id="left-middle-resizer"></div>

        <div class="middle-panel">
            <h2>Procedure Editor</h2>
            <div class="middle-content-wrapper">
                <div class="procedure-canvas-container">
                    <canvas id="procedureCanvas"></canvas>
                    <div class="overview-window-wrapper">
                        <button id="toggle-overview-btn" class="overview-toggle-btn" title="Overview">
                            &#9650;
                        </button>
                        <div class="overview-window hidden">
                            <!-- <h3>Overview</h3> -->
                            <canvas id="overviewCanvas"></canvas>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="horizontal-resizer" id="middle-right-resizer"></div>

        <div class="right-panels-container">
            <div class="right-top-panel">
                <div class="canvas-header">
                    <button id="open-folder-btn">Open Image Folder</button>
                </div>
                <div class="canvas-container">
                    <canvas id="imageCanvas"></canvas>
                    <div class="thumbnail-gallery" id="thumbnailGallery">
                        <!-- <div id="spacer"></div> 
                        <div id="thumbnailsContainer"></div> -->
                    </div>                       
                </div>
            </div>
            <div class="vertical-resizer" id="right-top-bottom-resizer"></div>
            <div class="right-bottom-panel">
                <h2>Variables</h2>

            </div>
        </div>
    </div>

    <div id="node-context-menu" class="context-menu hidden">
        <div class="context-menu-item" id="context-delete-node">Delete Node</div>
        <div class="context-menu-item" id="context-copy-node">Copy Node</div>
    </div>

    <script src="renderer.js"></script>
</body>
</html>
